<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disagreement Spot-check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --ink: #15202A; --muted: #5B6875; --line: #D8DEE4; --soft: #E9EDF1;
  --judge: #0D7672; --judge-soft: #D5EDEB; --human: #B4661A; --human-soft: #F6E6D3;
  --pass: #1E7F47; --pass-soft: #DCF0E3; --warn: #B83A26; --warn-soft: #F7DFD9;
  --f-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E141A; --surface: #151D25; --ink: #E5EBF0; --muted: #93A0AD; --line: #27323D; --soft: #1C252E;
    --judge: #45BDB7; --judge-soft: #143331; --human: #E4A257; --human-soft: #3A2A17;
    --pass: #56C584; --pass-soft: #153223; --warn: #F07862; --warn-soft: #3D1D17;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body); }
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
aside h1 { font-size: 1rem; margin: 0 16px 4px; }
.progress { margin: 0 16px 12px; font: 600 0.78rem/1.4 var(--f-mono); color: var(--muted); }
.bar { height: 6px; background: var(--soft); border-radius: 3px; margin: 6px 16px 14px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--pass); width: 0; transition: width 0.3s; }
.nav button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 18px 1fr; gap: 8px; width: 100%; padding: 8px 16px; cursor: pointer; font-size: 0.82rem; }
.nav button:hover { background: var(--soft); }
.nav button[aria-current="true"] { background: var(--judge-soft); }
.nav button:focus-visible { outline: 2px solid var(--judge); outline-offset: -2px; }
.nav .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); margin-top: 4px; }
.nav .dot.agree { background: var(--pass); border-color: var(--pass); }
.nav .dot.override { background: var(--warn); border-color: var(--warn); }
.nav .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .s { display: block; font: 400 0.72rem/1.3 var(--f-mono); color: var(--muted); }
.side-actions { padding: 14px 16px; display: grid; gap: 8px; border-top: 1px solid var(--line); margin-top: 10px; }
main { padding: 24px 32px 140px; max-width: 1280px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.eyebrow { font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.head { display: grid; gap: 8px; }
.head h2 { margin: 0; font-size: 1.35rem; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 400 0.8rem/1.4 var(--f-mono); color: var(--muted); }
.context { background: var(--soft); border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; }
.context summary { cursor: pointer; font-weight: 600; }
.context .turn { margin-top: 10px; white-space: pre-wrap; }
.context .role { font: 600 0.72rem/1 var(--f-mono); text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.v { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.v .who { font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.v .what { font-size: 1.05rem; font-weight: 700; }
.v .sub { font: 400 0.78rem/1.4 var(--f-mono); color: var(--muted); }
.v.h .who { color: var(--human); } .v.j .who { color: var(--judge); } .v.c .who { color: var(--muted); }
.replies { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.reply { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.reply header { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
.reply header b { font-size: 0.95rem; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 0.68rem/1 var(--f-mono); padding: 4px 6px; border-radius: 3px; }
.chip.h { background: var(--human-soft); color: var(--human); }
.chip.j { background: var(--judge-soft); color: var(--judge); }
.reply pre { margin: 0; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 0.88rem/1.55 var(--f-body); max-height: 52vh; overflow-y: auto; }
.claude { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 8px; padding: 14px 16px; display: grid; gap: 6px; }
.claude p { margin: 0; max-width: 90ch; }
.decide { position: fixed; left: 260px; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 32px; display: grid; gap: 10px; box-shadow: 0 -6px 20px rgba(0,0,0,0.06); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.b { font: 600 0.84rem/1 var(--f-body); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.b:hover { background: var(--soft); }
button.b:focus-visible { outline: 2px solid var(--judge); outline-offset: 2px; }
button.b[aria-pressed="true"].agree { background: var(--pass); color: var(--surface); border-color: var(--pass); }
button.b[aria-pressed="true"].ov { background: var(--warn); color: var(--surface); border-color: var(--warn); }
button.b.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
kbd { font: 600 0.7rem/1 var(--f-mono); padding: 2px 5px; border: 1px solid var(--line); border-radius: 3px; margin-left: 6px; opacity: 0.8; }
.note { flex: 1 1 360px; font: 400 0.9rem/1.4 var(--f-body); padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.hint { font-size: 0.76rem; color: var(--muted); }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: min(900px, 92vw); padding: 20px; }
dialog::backdrop { background: rgba(0,0,0,0.45); }
dialog textarea { width: 100%; height: 50vh; font: 400 0.8rem/1.5 var(--f-mono); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
  .decide { left: 0; padding: 12px 16px; }
  main { padding: 18px 16px 220px; }
  .replies, .verdicts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Spot-check</h1>
    <div class="progress" id="progress"></div>
    <div class="bar"><b id="bar"></b></div>
    <div class="nav" id="nav"></div>
    <div class="side-actions">
      <button class="b primary" id="export" type="button">Get commands</button>
      <button class="b" id="reset" type="button">Clear my answers</button>
      <span class="hint">Answers are kept in this browser until you clear them.</span>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="decide">
  <div class="row">
    <button class="b agree" id="v-agree" type="button">Agree with Claude<kbd>A</kbd></button>
    <span class="hint">or override to</span>
    <button class="b ov" id="v-humans_wrong" type="button">Humans wrong<kbd>1</kbd></button>
    <button class="b ov" id="v-judge_wrong" type="button">Judge wrong<kbd>2</kbd></button>
    <button class="b ov" id="v-question_unclear" type="button">Question unclear<kbd>3</kbd></button>
  </div>
  <div class="row">
    <input class="note" id="note" type="text" placeholder="Note (optional). Press N to type here, Enter to save and go to the next one.">
    <button class="b" id="prev" type="button">Previous<kbd>←</kbd></button>
    <button class="b" id="next" type="button">Next<kbd>→</kbd></button>
  </div>
</div>
<dialog id="dlg">
  <div style="display:grid;gap:12px">
    <strong id="dlgTitle"></strong>
    <span class="hint">Paste these into a terminal in ~/devel/agileedge/judgement_day. Each one appends a spot-check record to reviews/disagreements.jsonl.</span>
    <textarea id="cmds" readonly></textarea>
    <div class="row"><button class="b primary" id="copy" type="button">Copy</button><button class="b" id="close" type="button">Close</button><span class="hint" id="copied"></span></div>
  </div>
</dialog>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const R = JSON.parse(document.getElementById("data").textContent);
  const LBL = { humans_wrong: "Humans wrong", judge_wrong: "Judge wrong", question_unclear: "Question unclear" };
  const NAME = { a: "Response A", b: "Response B", tie: "Tie" };
  const KEY = "jd-spotcheck-v1";
  let ans = {};
  try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} };
  let i = 0;
  const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const note = document.getElementById("note");

  function navRender() {
    const nav = document.getElementById("nav");
    nav.replaceChildren();
    R.forEach((r, k) => {
      const a = ans[r.review_id];
      const b = el("button", { type: "button", "aria-current": String(k === i) });
      const dot = el("span", { class: "dot " + (a ? a.verdict : "") });
      const t = el("span");
      t.append(el("span", { class: "t" }, r.user_prompt.slice(0, 60)), el("span", { class: "s" }, (r.wrong_turn ? "⚠ wrong turn · " : "") + (r.fable && r.fable.label !== r.label ? "Opus ≠ Fable · " : "") + r.category + " · " + LBL[r.label] + (a && a.verdict === "override" ? " → " + LBL[a.label] : "")));
      t.querySelector(".t").style.display = "block";
      b.append(dot, t);
      b.addEventListener("click", () => go(k));
      nav.append(b);
    });
    const done = R.filter(r => ans[r.review_id]).length;
    document.getElementById("progress").textContent = done + " of " + R.length + " checked";
    document.getElementById("bar").style.width = (done / R.length * 100) + "%";
  }

  function chipFor(r, side) {
    const c = el("div", { class: "chips" });
    if (r.human_majority === side) c.append(el("span", { class: "chip h" }, "HUMANS " + r.human_votes[side] + " VOTES"));
    if (r.judge.pick === side) c.append(el("span", { class: "chip j" }, "JUDGE " + Math.round(r.judge.p[side] * 100) + "%"));
    return c;
  }

  function render() {
    const r = R[i];
    const m = document.getElementById("main");
    m.replaceChildren();
    const head = el("div", { class: "head" });
    head.append(el("span", { class: "eyebrow" }, (i + 1) + " / " + R.length + " · " + r.category + " · turn " + r.turn));
    head.append(el("h2", {}, r.user_prompt));
    const meta = el("div", { class: "meta" });
    meta.append(el("span", {}, "A = " + r.model_a), el("span", {}, "B = " + r.model_b), el("span", {}, "review " + r.review_id), el("span", {}, r.item_id));
    head.append(meta);
    m.append(head);

    if (r.wrong_turn) {
      const w = el("div", { class: "claude", style: "border-left-color: var(--warn); background: var(--warn-soft)" });
      w.append(el("span", { class: "eyebrow", style: "color: var(--warn)" }, "Claude reviewed the wrong turn"),
        el("p", {}, "The humans voted on turn 1, shown below. Claude's review compared the turn-2 replies to a follow-up question the humans never voted on. Its label and reasoning don't apply here. The judge also saw both turns. Judge these replies yourself; you may want to wait until this item is reviewed again."));
      m.append(w);
    }
    if (r.context && r.context.length) {
      const d = el("details", { class: "context" });
      d.append(el("summary", {}, "Earlier turn (" + r.context.length + " messages). The humans and the judge saw this first."));
      r.context.forEach(t => {
        const div = el("div", { class: "turn" });
        div.append(el("span", { class: "role" }, t.label), document.createTextNode(t.content));
        d.append(div);
      });
      m.append(d);
    }

    if (r.fable) {
      const pl = el("div", { class: "claude", style: "border-left-color: var(--judge)" });
      pl.append(el("span", { class: "eyebrow", style: "color: var(--judge)" }, "In plain English (Claude Fable 5.1)"), el("p", {}, r.fable.plain || ""));
      m.append(pl);
    }
    const v = el("div", { class: "verdicts" });
    const hv = r.human_votes;
    const mk = (cls, who, what, sub) => { const d = el("div", { class: "v " + cls }); d.append(el("span", { class: "who" }, who), el("span", { class: "what" }, what), el("span", { class: "sub" }, sub)); return d; };
    v.append(mk("h", "Human majority", NAME[r.human_majority], "A " + hv.a + " · B " + hv.b + " · tie " + hv.tie));
    v.append(mk("j", "AI judge", NAME[r.judge.pick], "A " + r.judge.p.a.toFixed(2) + " · B " + r.judge.p.b.toFixed(2) + " · tie " + r.judge.p.tie.toFixed(2)));
    v.append(mk("c", "Opus 5.5 label", LBL[r.label], "recorded by the pipeline"));
    if (r.fable) v.append(mk("c", "Fable 5.1 label", LBL[r.fable.label] || "none", r.fable.label === r.label ? "agrees with Opus" : "differs from Opus"));
    m.append(v);

    const cl = el("div", { class: "claude" });
    cl.append(el("span", { class: "eyebrow" }, "Opus 5.5 reasoning (the label you are checking)"), el("p", {}, r.reason));
    m.append(cl);
    if (r.fable) {
      const fc = el("div", { class: "claude" });
      fc.append(el("span", { class: "eyebrow" }, "Fable 5.1 reasoning (second opinion)"), el("p", {}, r.fable.reason || ""));
      m.append(fc);
    }

    const reps = el("div", { class: "replies" });
    [["a", r.reply_a], ["b", r.reply_b]].forEach(([s, txt]) => {
      const box = el("div", { class: "reply" });
      const h = el("header");
      h.append(el("b", {}, NAME[s]), chipFor(r, s));
      box.append(h, el("pre", {}, txt));
      reps.append(box);
    });
    m.append(reps);

    const a = ans[r.review_id];
    document.getElementById("v-agree").setAttribute("aria-pressed", String(!!a && a.verdict === "agree"));
    Object.keys(LBL).forEach(k => {
      const b = document.getElementById("v-" + k);
      b.setAttribute("aria-pressed", String(!!a && a.verdict === "override" && a.label === k));
      b.disabled = k === r.label;
      b.style.opacity = k === r.label ? 0.35 : 1;
    });
    note.value = a ? a.note || "" : "";
    navRender();
    window.scrollTo(0, 0);
  }

  function go(k) { storeNote(); i = Math.max(0, Math.min(R.length - 1, k)); render(); }
  function storeNote() { const r = R[i]; if (ans[r.review_id]) { ans[r.review_id].note = note.value; save(); } }
  function decide(verdict, label) {
    const r = R[i];
    if (verdict === "override" && label === r.label) return;
    ans[r.review_id] = { verdict, label: verdict === "override" ? label : null, note: note.value };
    save(); render();
  }

  document.getElementById("v-agree").addEventListener("click", () => decide("agree"));
  Object.keys(LBL).forEach(k => document.getElementById("v-" + k).addEventListener("click", () => decide("override", k)));
  document.getElementById("prev").addEventListener("click", () => go(i - 1));
  document.getElementById("next").addEventListener("click", () => go(i + 1));
  note.addEventListener("input", storeNote);
  note.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); storeNote(); note.blur(); go(i + 1); }
    if (e.key === "Escape") note.blur();
  });
  document.addEventListener("keydown", e => {
    if (e.target === note || document.getElementById("dlg").open || e.metaKey || e.ctrlKey) return;
    const k = e.key.toLowerCase();
    if (k === "a") decide("agree");
    else if (k === "1") decide("override", "humans_wrong");
    else if (k === "2") decide("override", "judge_wrong");
    else if (k === "3") decide("override", "question_unclear");
    else if (k === "arrowright" || k === "j") go(i + 1);
    else if (k === "arrowleft" || k === "k") go(i - 1);
    else if (k === "n") { e.preventDefault(); note.focus(); }
    else return;
  });

  const q = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
  document.getElementById("export").addEventListener("click", () => {
    storeNote();
    const done = R.filter(r => ans[r.review_id]);
    const lines = done.map(r => {
      const a = ans[r.review_id];
      let c = "mise exec ruby@4.0.6 -- bin/jd spotcheck add " + r.review_id + " --verdict " + a.verdict;
      if (a.verdict === "override") c += " --label " + a.label;
      c += " --note " + q(a.note || "");
      return c;
    });
    document.getElementById("dlgTitle").textContent = done.length + " of " + R.length + " checked" + (done.length < R.length ? " (the rest are left out)" : "");
    document.getElementById("cmds").value = lines.join("\n") + (lines.length ? "\n" : "");
    document.getElementById("copied").textContent = "";
    document.getElementById("dlg").showModal();
  });
  document.getElementById("copy").addEventListener("click", () => {
    const t = document.getElementById("cmds");
    navigator.clipboard.writeText(t.value).then(() => { document.getElementById("copied").textContent = "Copied."; },
      () => { t.select(); document.getElementById("copied").textContent = "Press Cmd+C to copy the selected text."; });
  });
  document.getElementById("close").addEventListener("click", () => document.getElementById("dlg").close());
  document.getElementById("reset").addEventListener("click", () => {
    if (!document.getElementById("reset").dataset.armed) { document.getElementById("reset").dataset.armed = "1"; document.getElementById("reset").textContent = "Click again to clear"; return; }
    ans = {}; save(); delete document.getElementById("reset").dataset.armed; document.getElementById("reset").textContent = "Clear my answers"; render();
  });
  render();
})();
</script>
</body>
</html>
